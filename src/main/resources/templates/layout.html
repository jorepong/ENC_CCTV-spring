<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content, headResources)">

<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">E-N-C 안전 시스템</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <th:block th:if="${headResources != null}" th:replace="${headResources}"></th:block>
</head>

<body>
    <div class="app-shell">
        <div class="page-shell">
            <nav class="side-menu" aria-label="섹션 탐색">
                <div class="brand-block">
                    <div class="brand-mark">ENC</div>
                    <div>
                        <p class="brand-name">안전 관제센터</p>
                        <p class="brand-description">캠퍼스 군중·사고 관제 플랫폼</p>
                    </div>
                </div>
                <p class="side-menu__title">실시간 분석</p>
                <a th:href="@{/}" th:classappend="${requestURI == '/' ? 'active' : ''}">대시보드</a>
                <a th:href="@{/analysis}" th:classappend="${requestURI == '/analysis' ? 'active' : ''}">분석</a>
                <a th:href="@{/map}" th:classappend="${#strings.startsWith(requestURI, '/map') ? 'active' : ''}">지도</a>
                <a th:href="@{/alerts}"
                    th:classappend="${#strings.startsWith(requestURI, '/alerts') ? 'active' : ''}">알림 이력</a>
                <p class="side-menu__title">통계 분석</p>
                <a th:href="@{/comparison}"
                    th:classappend="${#strings.startsWith(requestURI, '/comparison') ? 'active' : ''}">패턴/비교 분석</a>
                <p class="side-menu__title">관리</p>
                <a th:href="@{/cameras}" onclick="requestAdminAuth(event, this.href)"
                    th:classappend="${#strings.startsWith(requestURI, '/cameras') ? 'active' : ''}">카메라 관리</a>

                <p class="side-menu__title">디버그</p>
                <a th:href="@{/admin/density-verification}" onclick="requestAdminAuth(event, this.href)"
                    th:classappend="${#strings.startsWith(requestURI, '/admin/density-verification') ? 'active' : ''}"
                    class="side-menu__sub-item">밀집도 검증</a>
                <a th:href="@{/debug/train-perspective-map}" onclick="requestAdminAuth(event, this.href)"
                    class="side-menu__sub-item">원근맵 학습 실행</a>
            </nav>
            <main class="page-content" th:insert="${content}"></main>
        </div>
    </div>

    <!-- 관리자 권한 모달 -->
    <div id="admin-auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-top: 0;">관리자 접근 권한</h3>
            <p style="margin-bottom: 15px; color: #666;">비밀번호를 입력하세요.</p>
            <input type="password" id="admin-password-input" class="modal-input" placeholder="비밀번호"
                onkeydown="if(event.key==='Enter') confirmAdminAuth()">
            <div class="modal-buttons" style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeAdminModal()" class="modal-btn cancel">취소</button>
                <button onclick="confirmAdminAuth()" class="modal-btn confirm">확인</button>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-input:focus {
            border-color: #0f62fe;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-btn.cancel {
            background: #f1f3f5;
            color: #495057;
        }

        .modal-btn.cancel:hover {
            background: #e9ecef;
        }

        .modal-btn.confirm {
            background: #0f62fe;
            color: white;
        }

        .modal-btn.confirm:hover {
            background: #0050e6;
        }
    </style>

    <script>
        let targetUrl = '';

        function requestAdminAuth(event, url) {
            event.preventDefault();
            targetUrl = url;
            const modal = document.getElementById('admin-auth-modal');
            const input = document.getElementById('admin-password-input');

            modal.style.display = 'flex';
            input.value = '';
            // 모달이 표시된 직후에는 focus가 잘 안 잡힐 수 있으므로 약간의 지연을 줌
            setTimeout(() => input.focus(), 50);
        }

        function closeAdminModal() {
            document.getElementById('admin-auth-modal').style.display = 'none';
            targetUrl = '';
        }

        function confirmAdminAuth() {
            const password = document.getElementById('admin-password-input').value;
            if (password === '111111') {
                window.location.href = targetUrl;
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                const input = document.getElementById('admin-password-input');
                input.value = '';
                input.focus();
            }
        }

        // 모달 바깥 영역 클릭 시 닫기
        document.getElementById('admin-auth-modal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeAdminModal();
            }
        });
    </script>
</body>

</html>
